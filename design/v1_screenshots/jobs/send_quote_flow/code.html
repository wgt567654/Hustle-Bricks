<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Send Quote Flow</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#7c3aed",
                        "background-light": "#f8f6f6",
                        "background-dark": "#211411",
                        "surface-light": "#ffffff",
                        "surface-dark": "#352724",
                        "text-main": "#181211",
                        "text-sub": "#886963",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-text-main dark:text-gray-100 antialiased overflow-x-hidden">
<div class="relative flex h-full min-h-screen w-full flex-col">
<header class="sticky top-0 z-10 bg-surface-light dark:bg-surface-dark px-4 py-3 flex items-center justify-between shadow-sm transition-colors duration-200">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-1 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-text-main dark:text-white" style="font-size: 24px;">arrow_back</span>
</button>
<h1 class="text-lg font-bold leading-tight tracking-tight text-text-main dark:text-white">Send Quote #1024</h1>
</div>
<button class="text-primary font-bold text-base tracking-wide hover:opacity-80 transition-opacity">
                Preview
            </button>
</header>
<main class="flex-1 overflow-y-auto pb-24">
<div class="mt-6 mb-2 px-4">
<h4 class="text-text-sub dark:text-gray-400 text-sm font-bold uppercase tracking-wider mb-2">Delivery Method</h4>
</div>
<div class="px-4">
<div class="flex w-full gap-3">
<label class="relative flex flex-1 cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-primary bg-surface-light dark:bg-surface-dark p-4 shadow-sm transition-all">
<input checked="" class="peer sr-only" name="delivery_method" type="radio" value="email"/>
<span class="material-symbols-outlined text-primary" style="font-size: 28px;">mail</span>
<span class="text-primary font-bold text-sm">Email</span>
<div class="absolute right-2 top-2 h-2 w-2 rounded-full bg-primary"></div>
</label>
<label class="relative flex flex-1 cursor-pointer flex-col items-center justify-center gap-2 rounded-xl border-2 border-transparent bg-white dark:bg-surface-dark hover:bg-gray-50 dark:hover:bg-[#4a3b38] p-4 shadow-sm transition-all ring-1 ring-black/5 dark:ring-white/10">
<input class="peer sr-only" name="delivery_method" type="radio" value="sms"/>
<span class="material-symbols-outlined text-text-sub dark:text-gray-400" style="font-size: 28px;">sms</span>
<span class="text-text-sub dark:text-gray-400 font-medium text-sm">Text</span>
</label>
</div>
</div>
<div class="mt-8 mb-2 px-4">
<h4 class="text-text-sub dark:text-gray-400 text-sm font-bold uppercase tracking-wider mb-2">Recipient Details</h4>
</div>
<div class="space-y-4 px-4">
<div class="relative">
<input class="peer block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-surface-light dark:bg-surface-dark px-4 pb-2 pt-6 text-base text-text-main dark:text-white focus:border-primary focus:ring-1 focus:ring-primary dark:focus:border-primary focus:outline-none transition-colors" id="client_name" placeholder=" " type="text" value="Sarah Miller"/>
<label class="absolute left-4 top-4 z-10 origin-[0] -translate-y-2.5 scale-75 transform text-sm text-text-sub dark:text-gray-400 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-2.5 peer-focus:scale-75 peer-focus:text-primary" for="client_name">
                        Client Name
                    </label>
</div>
<div class="relative">
<input class="peer block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-surface-light dark:bg-surface-dark px-4 pb-2 pt-6 text-base text-text-main dark:text-white focus:border-primary focus:ring-1 focus:ring-primary dark:focus:border-primary focus:outline-none transition-colors" id="client_email" placeholder=" " type="email" value="sarah.miller@example.com"/>
<label class="absolute left-4 top-4 z-10 origin-[0] -translate-y-2.5 scale-75 transform text-sm text-text-sub dark:text-gray-400 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-2.5 peer-focus:scale-75 peer-focus:text-primary" for="client_email">
                        Email Address
                    </label>
</div>
<div class="relative">
<input class="peer block w-full rounded-lg border border-gray-300 dark:border-gray-600 bg-surface-light dark:bg-surface-dark px-4 pb-2 pt-6 text-base text-text-main dark:text-white focus:border-primary focus:ring-1 focus:ring-primary dark:focus:border-primary focus:outline-none transition-colors" id="subject" placeholder=" " type="text" value="Quote for Lawn Care Services"/>
<label class="absolute left-4 top-4 z-10 origin-[0] -translate-y-2.5 scale-75 transform text-sm text-text-sub dark:text-gray-400 duration-200 peer-placeholder-shown:translate-y-0 peer-placeholder-shown:scale-100 peer-focus:-translate-y-2.5 peer-focus:scale-75 peer-focus:text-primary" for="subject">
                        Subject Line
                    </label>
</div>
</div>
<div class="mt-8 px-4">
<div class="flex items-center justify-between rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm border border-gray-100 dark:border-gray-700">
<div class="flex items-center gap-3">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined">receipt_long</span>
</div>
<div class="flex flex-col">
<span class="text-sm font-medium text-text-sub dark:text-gray-400">Total Amount</span>
<span class="text-lg font-bold text-text-main dark:text-white">$150.00</span>
</div>
</div>
<div class="flex flex-col items-end">
<span class="text-xs font-medium text-text-sub dark:text-gray-400">Due Date</span>
<span class="text-sm font-semibold text-text-main dark:text-white">Oct 24, 2023</span>
</div>
</div>
</div>
<div class="mt-8 mb-2 px-4">
<h4 class="text-text-sub dark:text-gray-400 text-sm font-bold uppercase tracking-wider mb-2">Compliance</h4>
</div>
<div class="px-4">
<div class="flex items-center justify-between rounded-xl bg-surface-light dark:bg-surface-dark p-4 shadow-sm border border-gray-100 dark:border-gray-700">
<div class="flex flex-col pr-4">
<span class="text-base font-medium text-text-main dark:text-white">Attach W-9 Form</span>
<span class="text-xs text-text-sub dark:text-gray-400 mt-1 leading-normal">Required if client is a business and pays &gt;$600/yr.</span>
</div>
<label class="relative inline-flex cursor-pointer items-center">
<input class="peer sr-only" type="checkbox" value=""/>
<div class="peer h-7 w-12 rounded-full bg-gray-200 dark:bg-gray-600 after:absolute after:left-[2px] after:top-[2px] after:h-6 after:w-6 after:rounded-full after:bg-white after:transition-all after:content-[''] peer-checked:bg-primary peer-checked:after:translate-x-full peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20"></div>
</label>
</div>
</div>
</main>
<footer class="fixed bottom-0 left-0 right-0 z-20 bg-surface-light dark:bg-surface-dark p-4 border-t border-gray-100 dark:border-gray-800 safe-area-bottom">
<button class="flex w-full items-center justify-center gap-2 rounded-xl bg-primary py-3.5 text-white shadow-lg shadow-primary/30 transition-transform active:scale-[0.98]">
<span class="text-base font-bold tracking-wide">Send Quote</span>
<span class="material-symbols-outlined" style="font-size: 20px;">send</span>
</button>
</footer>
</div>

</body></html>
